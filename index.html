<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pindorama Pets - Veterinária</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Poppins:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <nav class="navbar">

            <button class="menu-toggle" id="mobile-menu" aria-label="Abrir menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>


            <div class="brand-container">

                <div class="logo">
                    <svg class="logo-text-curvo" viewBox="0 0 100 40" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg">
                        <path id="caminho-do-texto" d="M 0 36 Q 50 4 100 36" fill="none" />
                        <text font-family="Poppins" font-size="10" font-weight="600">
                            <textPath href="#caminho-do-texto" startOffset="50%" text-anchor="middle">
                                ESTD 2021
                            </textPath>
                        </text>
                    </svg>

                    </svg>


                    <a href="/">
                        <img src="images/logo.svg" alt="Logo Pindorama Pets" class="logo-img">
                    </a>

                </div>

                <span class="brand-title">PINDORAMA PETS</span>

            </div>

            <nav class="nav-menu" id="nav-menu">
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#servicos">Serviços</a></li>
                    <li><a href="#sobre">Sobre Nós</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>

        </nav>


    </header>

    <main>
        <section class="hero" id="inicio">
            <div class="hero-container">

                <div class="hero-text">
                    <h1 class="hero-title">
                        <span class="mobile-title">Cuidamos do seu<br> animal com muito<br> amor</span>
                        <span class="desktop-title">Cuidando do Seu Pet com<br> Profissionalismo e Carinho</span>
                    </h1>
                </div>

                <div class="hero-visual">
                    <img src="images/grupo-de-animais.png" alt="Grupo de cães, gatos e um pássaro" class="hero-pets-img">
                    <img src="images/Waveform.png" alt="" class="hero-decor-lines" aria-hidden="true">
                </div>

                <div class="hero-cta">
                    <a href="#contato" class="btn-primary">Entre em contato</a>
                </div>

            </div>
        </section>
    </main>



    <script src="js/script.js"></script>
</body>

</html>
